<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fresh Basket – Digital Grocery Display</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2b22;--mut:#6b7a70;--line:#e4e0d4;--g:#1f7a4d;--g2:#e3f3ea;--warn:#c2410c;--warn2:#fdebdc;--box-sizing:border-box;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121a15;--card:#1a251e;--ink:#eaf1ec;--mut:#92a59a;--line:#2a3a30;--g:#4cc58a;--g2:#1c3327;--warn:#fb923c;--warn2:#3a2616}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121a15;--card:#1a251e;--ink:#eaf1ec;--mut:#92a59a;--line:#2a3a30;--g:#4cc58a;--g2:#1c3327;--warn:#fb923c;--warn2:#3a2616}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}header h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 110px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--g);border:1px solid var(--g)}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.p .e{font-size:40px;line-height:1.1}.p .n{font-weight:600}.p .u{color:var(--mut);font-size:12px}
.p .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--g);background:var(--g2);color:var(--g);font-weight:700;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:none;justify-content:space-between;align-items:center;z-index:6}
.bar.show{display:flex}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.panel h2{margin:0 0 8px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tot{font-weight:700;font-size:17px;display:flex;justify-content:space-between;padding:12px 0}
.note{background:var(--warn2);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.ok{text-align:center;padding:20px 0}.ok .big{font-size:56px}
.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.order .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--warn2);color:var(--warn)}
.tag.Packed{background:var(--g2);color:var(--g)}.tag.Delivered{background:var(--line);color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.center{max-width:360px;margin:40px auto}
#qr{background:#fff;padding:10px;display:inline-block;border-radius:10px}
a{color:var(--g)}
</style>
</head>
<body>
<div id="app"></div>
<script>

["Household",[["🧼","Bath Soap","1 pc",38],["🧴","Detergent","1 kg",110],["🧻","Tissue Roll","1 pack",60]]]
];
var ITEMS=[],CATS=["All"];
CATALOG.forEach(function(c){CATS.push(c[0]);c[1].forEach(function(p,i){ITEMS.push({id:c[0].slice(0,2)+i+p[1].replace(/\W/g,""),cat:c[0],e:p[0],n:p[1],u:p[2],p:p[3]})})});

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var money=function(n){return SHOP.currency+n.toLocaleString("en-IN")};
var cart={},cat="All",q="",db=null,dbTried=false,lastOrder=null,orders=[],unsub=null,authed=false;

function route(){return location.hash==="#shop"?"shop":"store"}
function lsGet(){try{return JSON.parse(localStorage.getItem("fb_orders")||"[]")}catch(e){return []}}
function lsSet(a){try{localStorage.setItem("fb_orders",JSON.stringify(a))}catch(e){}}
function initDb(){
  if(dbTried)return;dbTried=true;
  if(!window.claude||!claude.use){render();return}
  claude.use("db").then(function(d){db=d;if(route()==="shop"&&authed)listen();render()}).catch(function(){render()});
}
function listen(){
  if(unsub){unsub();unsub=null}
  if(!db){orders=lsGet();return}
  try{unsub=db.collection("orders").onSnapshot(function(s){
    orders=s.docs.map(function(d){return d.data()}).sort(function(a,b){return b.ts-a.ts});
    if(route()==="shop"&&authed)renderOrders();
  },function(){})}catch(e){}
}

/* ---------- CUSTOMER STORE ---------- */
function count(){var n=0;for(var k in cart)n+=cart[k];return n}
function total(){var t=0;ITEMS.forEach(function(i){t+=(cart[i.id]||0)*i.p});return t}
function setQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];renderGrid();renderBar();if($("#cartSheet.show"))renderCart()}
function renderStore(){
  $("#app").innerHTML='<header><h1>🛒 '+esc(SHOP.name)+'<small>'+esc(SHOP.tag)+'</small></h1></header>'
  +'<div class="wrap"><input id="s" type="search"
